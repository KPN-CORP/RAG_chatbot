services:
  etcd:
    image: bitnami/etcd:3.5
    environment:
      - ALLOW_NONE_AUTHENTICATION=yes
      - ETCD_ADVERTISE_CLIENT_URLS=http://etcd:2379
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379
    volumes: [etcd-data:/bitnami/etcd]
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}         # from .env
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD} # from .env
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # MinIO console
    volumes: [minio-data:/data]
    restart: unless-stopped

  # One-time bootstrap: create bucket + limited user for Milvus
  minio-setup:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: ["/bin/sh","-c"]
    command: >
      set -e;
      until (mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"); do
        echo "waiting for minio..."; sleep 2;
      done;
      mc mb --ignore-existing local/$$MINIO_BUCKET;
      cat >/tmp/milvus-bucket-rw.json <<'POLICY'
      {
        "Version":"2012-10-17",
        "Statement":[
          {"Effect":"Allow","Action":["s3:ListBucket","s3:GetBucketLocation"],"Resource":["arn:aws:s3:::milvus-bucket"]},
          {"Effect":"Allow","Action":["s3:PutObject","s3:GetObject","s3:DeleteObject","s3:ListBucketMultipartUploads","s3:AbortMultipartUpload","s3:ListMultipartUploadParts"],"Resource":["arn:aws:s3:::milvus-bucket/*"]}
        ]
      }
      POLICY
      mc admin policy create local milvus-bucket-rw /tmp/milvus-bucket-rw.json || true;
      mc admin user add local "$$MILVUS_MINIO_USER" "$$MILVUS_MINIO_SECRET" || true;
      mc admin policy attach local milvus-bucket-rw --user "$$MILVUS_MINIO_USER";
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-milvus-bucket}
      MILVUS_MINIO_USER: ${MILVUS_MINIO_USER:-milvus_user}
      MILVUS_MINIO_SECRET: ${MILVUS_MINIO_SECRET:-milvus_secret}
    restart: "no"

  milvus:
    image: milvusdb/milvus:${MILVUS_TAG}   # from .env
    command: ["milvus","run","standalone"]
    depends_on: [etcd, minio, minio-setup]
    ports:
      - "19530:19530" # gRPC
    environment:
      ETCD_ENDPOINTS: etcd:2379

      # MinIO/S3 config via env vars (no milvus.yaml needed)
      MINIO_ADDRESS: minio
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
      MINIO_BUCKET_NAME: ${MINIO_BUCKET:-milvus-bucket}
      MINIO_ROOT_PATH: ${MINIO_ROOT_PATH:-files}

      # Dedicated MinIO user for Milvus (created by minio-setup)
      MINIO_ACCESS_KEY_ID: ${MILVUS_MINIO_USER:-milvus_user}
      MINIO_SECRET_ACCESS_KEY: ${MILVUS_MINIO_SECRET:-milvus_secret}
    volumes:
      - milvus-data:/var/lib/milvus
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server","--appendonly","yes","--requirepass","${REDIS_PASSWORD}"]
    # Expose to host for local dev; on staging you can remove ports to keep it internal-only
    ports:
      - "6379:6379"
    volumes: [redis-data:/data]
    restart: unless-stopped

  # Optional Milvus UI
  attu:
    image: zilliz/attu:latest
    environment: [MILVUS_URL=milvus:19530]
    depends_on: [milvus]
    ports: ["8000:3000"]
    restart: unless-stopped

volumes:
  etcd-data:
  minio-data:
  milvus-data:
  redis-data:
